[config]
schemaVersion = "0.0.1"

[package]
namespace = "Jaosnake"
name = "CENI"
versionNumber = "1.0.1"
description = "Stage save states with a selectable UI, five slots per character, controller support, and pt-BR localization."
websiteUrl = "https://github.com/Jaosnake/CENI"
containsNsfwContent = false

[package.dependencies]
bbepis-BepInExPack = "5.4.2121"
RiskofThunder-HookGenPatcher = "1.2.9"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./ProperSave/bin/Release/netstandard2.1/CENI.dll"
target = "./plugins/CENI/"

[[build.copy]]
source = "./ProperSave/bin/Release/netstandard2.1/Language"
target = "./plugins/CENI/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["riskofrain2"]
categories = ["mods", "tweaks", "server-side"]
